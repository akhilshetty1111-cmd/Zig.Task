# Serves the built React app and makes client-side routing (React Router)
# work on a hard refresh or a direct link.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routes like /projects/abc123 entirely in the
    # browser - there is no server-side "/projects/abc123" file. Without this
    # fallback, refreshing that URL (or opening it directly) would 404: nginx
    # would look for a literal file at that path and not find one. Instead,
    # always fall back to index.html and let React Router take it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browsers probe /favicon.ico automatically regardless of the <link
    # rel="icon"> declared in index.html; there is no file at that path
    # (the app uses an inline SVG data URI instead). A bare 204 avoids the
    # 404 that would otherwise show up in the browser console on every load.
    location = /favicon.ico {
        return 204;
    }

    # Vite fingerprints built assets with a content hash in the filename
    # (e.g. index-BLSvgd67.js), so a cached copy is always for the exact
    # version referenced by the current index.html - safe to cache "forever".
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
