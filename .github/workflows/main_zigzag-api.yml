# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Auto-generated by Azure's Deployment Center, then hand-fixed: the generated
# version ran `dotnet build`/`dotnet publish` with no path at all, which only
# works if the .csproj sits at the repo root. This repo's backend solution
# lives in backend/ instead, so every step below is pointed at it explicitly.

name: Build and deploy ASP.Net Core app to Azure Web App - zigzag-api

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_zigzag-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore src/ZigZag.API/ZigZag.API.csproj

      - name: Build with dotnet
        working-directory: backend
        run: dotnet build src/ZigZag.API/ZigZag.API.csproj --no-restore --configuration Release

      - name: dotnet publish
        working-directory: backend
        run: dotnet publish src/ZigZag.API/ZigZag.API.csproj --no-build --configuration Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zigzag-api'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1F7DECB398FC44B0A68550978BFF8F5D }}
